name: Build and push ghcr.io/piazzean/acelink

on:
  push:
    branches: [master]
  release:
    types: [published]

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      -
        name: Checkout
        uses: actions/checkout@v2
      -
        name: Set up QEMU
        uses: docker/setup-qemu-action@v1
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1
      -
        name: Login to GitHub Container Registry
        uses: docker/login-action@v1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      -
        name: Build and push
        uses: docker/build-push-action@v2
        if: ${{ github.ref == 'refs/heads/master' }}
        with:
          context: .
          platforms: linux/amd64,linux/arm64  # arm64 runs the x86_64 engine through box64
          push: true
          tags: ghcr.io/piazzean/acelink:latest
      -
        name: Build and push
        uses: docker/build-push-action@v2
        if: ${{ github.event.release.tag_name }}
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/piazzean/acelink:${{ github.event.release.tag_name }}
